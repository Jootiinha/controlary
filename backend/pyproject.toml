[tool.poetry]
name = "controle-financeiro-backend"
version = "1.0.0"
description = "API backend for Controle Financeiro Web application"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.104.1"
uvicorn = { version = "0.24.0", extras = ["standard"] }
sqlalchemy = "2.0.23"
alembic = "1.12.1"
pydantic = { version = "2.5.0", extras = ["email"] }
bcrypt = "4.1.1"
PyJWT = "^2.8.1"
python-multipart = "0.0.6"
python-dotenv = "1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
pytest-cov = "4.1.0"
httpx = "0.25.1"
black = "23.12.0"
ruff = "0.1.8"
mypy = "1.7.1"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
