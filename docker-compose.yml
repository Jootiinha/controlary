version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controle-financeiro-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: sqlite:////data/controle_financeiro.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://frontend"]}
    volumes:
      - ./backend/data:/data
    ports:
      - "8000:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - db-volume

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: controle-financeiro-frontend
    environment:
      NODE_ENV: production
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  # Volume container for persistent data
  db-volume:
    image: alpine:latest
    container_name: controle-financeiro-db-volume
    volumes:
      - ./backend/data:/data
    command: /bin/sh -c "mkdir -p /data && chmod 777 /data"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
    driver: local
